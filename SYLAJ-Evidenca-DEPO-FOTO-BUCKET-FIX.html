<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a4d8c" />
  <meta name="application-name" content="SYLAJ Evidenca" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="SYLAJ-Evidenca 2.0 - Sistem za evidenco gradbeništva" />
  
  <title>SYLAJ d.o.o. - Evidenca 2.0</title>
  <style>:root {
  --primary: #0a4d8c;
  --primary-dark: #083a6b;
  --primary-light: #1a6bb5;
  --accent: #f0c040;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --blue-card: #0a4d8c;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
}

.hidden { display: none !important; }

.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  z-index: 9999;
}
.loader {
  width: 48px;
  height: 48px;
  border: 4px solid rgba(255,255,255,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Login */
.login-container {
  max-width: 400px;
  margin: 60px auto;
  padding: 32px 24px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo-icon { font-size: 56px; }
.login-logo h1 { font-size: 24px; color: var(--primary); margin-top: 8px; }
.login-logo p { color: var(--text-muted); font-size: 14px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
.form-group input, .form-group select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  transition: border 0.2s;
}
.form-group input:focus { border-color: var(--primary); }
.btn-primary {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.btn-primary:active { background: var(--primary-dark); }
.lang-select-login { margin-top: 20px; text-align: center; }
.lang-select-login select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }

/* Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header-center {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-logo { font-size: 28px; }
.header-title { font-size: 16px; font-weight: 700; line-height: 1.2; }
.header-subtitle { font-size: 11px; opacity: 0.85; }
.icon-btn {
  background: transparent;
  border: none;
  color: white;
  font-size: 18px;
  padding: 8px;
  position: relative;
  cursor: pointer;
}
.badge {
  position: absolute;
  top: 2px;
  right: 2px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  font-weight: 700;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Banner */
.banner {
  height: 140px;
  background: linear-gradient(135deg, #1a5a9c 0%, #0a3d6e 100%),
              url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200"><rect fill="%230a4d8c" width="800" height="200"/><circle fill="%23f0c040" opacity="0.15" cx="100" cy="50" r="80"/><circle fill="%23ffffff" opacity="0.08" cx="700" cy="150" r="100"/></svg>');
  background-size: cover;
  position: relative;
  overflow: hidden;
}
.banner-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(10,77,140,0.3), rgba(10,77,140,0.7));
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 16px;
}
.company-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.95);
  padding: 8px 14px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.badge-icon { font-size: 24px; }
.company-badge strong { display: block; font-size: 14px; color: var(--primary); }
.company-badge span { font-size: 11px; color: var(--text-muted); }
.lang-flag select {
  background: white;
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Content */
.content {
  padding: 12px;
  padding-bottom: 90px;
  min-height: calc(100vh - 200px);
}

/* Module Grid */
.module-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
@media (min-width: 480px) {
  .module-grid { grid-template-columns: repeat(4, 1fr); }
}
.module-card {
  background: var(--blue-card);
  color: white;
  border-radius: 14px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  min-height: 110px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  box-shadow: 0 4px 12px rgba(10,77,140,0.3);
}
.module-card:active { transform: scale(0.97); }
.module-card .icon {
  font-size: 26px;
  margin-bottom: 8px;
  opacity: 0.95;
}
.module-card .title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.module-card .desc {
  font-size: 10px;
  opacity: 0.8;
  line-height: 1.3;
}
.module-card .arrow {
  position: absolute;
  top: 12px;
  right: 12px;
  opacity: 0.6;
  font-size: 12px;
}
.module-card .card-badge {
  position: absolute;
  top: 8px;
  right: 28px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* Quick Overview */
.quick-overview {
  background: white;
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow-x: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  margin-bottom: 8px;
}
.quick-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}
.quick-item {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
}
.quick-item .q-icon { font-size: 16px; }
.quick-item .q-num { color: var(--primary); }

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-around;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 10px;
  cursor: pointer;
  padding: 6px 12px;
}
.nav-item i { font-size: 20px; }
.nav-item.active { color: var(--primary); }
.nav-add {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--primary);
  color: white !important;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -20px;
  box-shadow: 0 4px 12px rgba(10,77,140,0.4);
}
.nav-add i { font-size: 24px; }

/* Subpage Header */
.sub-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: var(--primary);
  color: white;
  position: sticky;
  top: 0;
  z-index: 50;
}
.sub-header .back-btn, .sub-header .home-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.sub-header .title-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.sub-header .title-area i { font-size: 22px; }
.sub-header h2 { font-size: 16px; font-weight: 700; }
.sub-header .subtitle { font-size: 11px; opacity: 0.85; }

/* Tabs / Action bar */
.action-bar {
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  overflow-x: auto;
  background: white;
  border-bottom: 1px solid var(--border);
}
.action-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  background: #f1f5f9;
  border: none;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  min-width: 70px;
}
.action-btn i { font-size: 18px; color: var(--primary); }
.action-btn.active {
  background: var(--primary);
  color: white;
}
.action-btn.active i { color: white; }

/* Filters */
.filters {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  overflow-x: auto;
  background: #f8fafc;
}
.filter-select {
  flex-shrink: 0;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: white;
  min-width: 120px;
}

/* Table */
.table-wrap {
  overflow-x: auto;
  background: white;
  margin: 0 0 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
th {
  background: #f1f5f9;
  padding: 10px 8px;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
  border-bottom: 2px solid var(--border);
}
td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:active { background: #f0f7ff; }
.row-actions {
  display: flex;
  gap: 6px;
}
.row-actions button {
  background: none;
  border: none;
  color: var(--primary);
  font-size: 14px;
  cursor: pointer;
  padding: 4px;
}
.row-actions .del { color: var(--danger); }

/* Totals bar */
.totals-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
  background: white;
  border-top: 1px solid var(--border);
  font-size: 13px;
  font-weight: 600;
}
.totals-bar .total-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.totals-bar .val { color: var(--primary); }
.totals-bar .team-fitimi { color: #059669; }
.totals-bar .team-lumi { color: #7c3aed; }

/* Floating action */
.fab-export {
  position: fixed;
  bottom: 80px;
  right: 16px;
  background: #217346;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 14px rgba(33,115,70,0.4);
  cursor: pointer;
  z-index: 40;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.modal {
  background: white;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 500px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 18px; }
.modal-close {
  background: #f1f5f9;
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.form-row.full { grid-template-columns: 1fr; }
.modal .form-group label { font-size: 12px; }
.modal .btn-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.btn-secondary {
  flex: 1;
  padding: 12px;
  background: #f1f5f9;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
.btn-danger {
  background: var(--danger);
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  font-weight: 600;
  cursor: pointer;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state i { font-size: 48px; opacity: 0.3; margin-bottom: 12px; }

/* Profile / Settings */
.settings-list {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}
.settings-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.settings-item:last-child { border-bottom: none; }
.settings-item i { font-size: 20px; color: var(--primary); width: 28px; text-align: center; }
.settings-item span { flex: 1; font-weight: 500; }
.settings-item .chevron { color: var(--text-muted); }

/* Responsive */
@media (min-width: 768px) {
  .content { max-width: 900px; margin: 0 auto; }
  .module-grid { grid-template-columns: repeat(4, 1fr); }
  .modal { border-radius: 16px; margin-bottom: 40px; }
  .modal-overlay { align-items: center; }
}

function localMonthKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function nextMonthKey(month) { const [y,m]=month.split('-').map(Number); return `${y+Math.floor(m/12)}-${String(m%12+1).padStart(2,'0')}`; }

async function initAuth() {
  if (!supabaseClient) { showLogin(); return; }
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session?.user) {
    currentUser = session.user;
    await loadProfile();
    showMain();
  } else {
    showLogin();
  }
  supabaseClient.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session?.user) {
      currentUser = session.user;
      await loadProfile();
      showMain();
    } else if (event === 'SIGNED_OUT') {
      currentUser = null; currentProfile = null; isAdmin = false; userTeamIds = [];
      showLogin();
    }
  });
}

async function loadProfile() {
  if (!currentUser) return;
  try {
    const { data, error } = await supabaseClient.from('profili').select('*').eq('id', currentUser.id).maybeSingle();
    currentProfile = data || { id: currentUser.id, ime: currentUser.email, vloga: 'user' };
    isAdmin = (currentProfile.vloga || '').toLowerCase() === 'admin';

    const { data: teams } = await supabaseClient.from('ekipe').select('id, naziv').eq('vodja_id', currentUser.id);
    userTeamIds = (teams || []).map(t => t.id);
    if (isAdmin) {
      const { data: allTeams } = await supabaseClient.from('ekipe').select('id');
      userTeamIds = (allTeams || []).map(t => t.id);
    }
  } catch (e) { console.error(e); }
}

async function doLogin(email, password) {
  const btn = document.querySelector('#login-form button');
  if (btn) { btn.disabled = true; btn.textContent = t('loading'); }
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (btn) { btn.disabled = false; btn.textContent = t('login'); }
  if (error) { alert(t('loginError') + '\n' + error.message); return false; }
  return true;
}

async function doLogout() {
  await supabaseClient.auth.signOut();
}

async function loadTeams() {

}

async function loadWorkers() {
  let q = supabaseClient.from('delavci').select('id, ime_priimek, ekipa_id, aktiven').is('izbrisano_at', null).order('ime_priimek');
  if (!isAdmin && !userTeamIds.length) { state.cache.hours=[]; return []; }
  if (!isAdmin) q = q.in('ekipa_id', userTeamIds);
  const { data } = await q;
  state.cache.workers = data || [];
  return state.cache.workers;
}

async function loadSites() {
  let q = supabaseClient.from('gradbisca').select('id, naziv, naslov, ekipa_id').is('izbrisano_at', null).order('naziv');
  if (!isAdmin && userTeamIds.length) q = q.in('ekipa_id', userTeamIds);
  const { data } = await q;
  state.cache.sites = data || [];
  return state.cache.sites;
}

async function loadHours(filters = {}) {
  const month = filters.month || state.hoursFilter.month;
  const start = month + '-01';
  const end = nextMonthKey(month) + '-01';

  let q = supabaseClient.from('delovne_ure').select('*').is('izbrisano_at', null)
    .gte('datum', start).lt('datum', end).order('datum', { ascending: true }).order('id', { ascending: true });

  if (!isAdmin && userTeamIds.length) q = q.in('ekipa_id', userTeamIds);
  if (filters.team && filters.team !== 'all') q = q.eq('ekipa_id', filters.team);
  if (filters.worker && filters.worker !== 'all') q = q.eq('delavec_id', filters.worker);
  if (filters.site && filters.site !== 'all') q = q.eq('gradbisce_id', filters.site);

  const { data, error } = await q;
  if (error) { console.error(error); return []; }
  state.cache.hours = data || [];
  return state.cache.hours;
}

async function loadStats() {
  try {
    let wq = supabaseClient.from('delavci').select('id', { count: 'exact', head: true }).is('izbrisano_at', null).eq('aktiven', true);
    if (!isAdmin && userTeamIds.length) wq = wq.in('ekipa_id', userTeamIds);
    const { count: wc } = await wq;

    let sq = supabaseClient.from('gradbisca').select('id', { count: 'exact', head: true }).is('izbrisano_at', null);
    if (!isAdmin && userTeamIds.length) sq = sq.in('ekipa_id', userTeamIds);
    const { count: sc } = await sq;

    const { count: mc } = await supabaseClient.from('bagerji').select('id', { count: 'exact', head: true }).is('izbrisano_at', null).eq('aktivno', true);
    const { count: vc } = await supabaseClient.from('vozila').select('id', { count: 'exact', head: true });

    state.cache.stats = { workers: wc || 0, sites: sc || 0, machines: mc || 0, vehicles: vc || 0 };
  } catch (e) {
    state.cache.stats = { workers: 0, sites: 0, machines: 0, vehicles: 0 };
  }
}

function sloveniaToday() {
  return new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Ljubljana', year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
}

function calcHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.toString().split(':').map(Number);
  const [eh, em] = end.toString().split(':').map(Number);
  let total = (eh + em/60) - (sh + sm/60);
  if (total < 0) total += 24;
  return Math.round(total * 100) / 100;
}

async function saveHourRecord(record, id = null) {
  const payload = {
    delavec_id: record.delavec_id,
    ekipa_id: record.ekipa_id,
    gradbisce_id: record.gradbisce_id || null,
    datum: record.datum,
    zacetek: record.zacetek,
    konec: record.konec,
    malica_zacetek: record.malica_zacetek || null,
    malica_konec: record.malica_konec || null,
    opomba: record.opomba || null,
    vnesel_id: currentUser.id
  };

  if (!isAdmin) {
    if (!String(payload.opomba || '').trim()) {
      alert('Opis opravljenega dela je obvezen. Brez opisa ur ni mogoče shraniti.');
      return false;
    }
    if (!userTeamIds.some(teamId => String(teamId) === String(payload.ekipa_id)) ||
        !state.cache.workers.some(w => String(w.id) === String(payload.delavec_id) && String(w.ekipa_id) === String(payload.ekipa_id))) {
      alert('Ure lahko vnašate samo za delavce svoje ekipe.');
      return false;
    }
    const today = sloveniaToday();
    if (payload.datum !== today) {
      alert('Lahko urejate samo ure za današnji dan.');
      return false;
    }
  }

  if (id) {
    const { error } = await supabaseClient.from('delovne_ure').update(payload).eq('id', id).is('izbrisano_at', null);
    if (error) { alert(t('error') + ': ' + error.message); return false; }
  } else {
    const { error } = await supabaseClient.from('delovne_ure').insert(payload);
    if (error) { alert(t('error') + ': ' + error.message); return false; }
  }
  return true;
}

async function softDeleteHour(id) {
  if (!confirm('Ali ste prepričani?')) return false;
  if (!isAdmin) {
    const rec = state.cache.hours.find(h => h.id == id);
    if (rec && rec.datum !== sloveniaToday()) {
      alert('Lahko brišete samo današnje ure.');
      return false;
    }
  }
  const { error } = await supabaseClient.from('delovne_ure').update({
    izbrisano_at: new Date().toISOString(),
    izbrisal_id: currentUser.id
  }).eq('id', id);
  if (error) { alert(t('error') + ': ' + error.message); return false; }
  return true;
}

 el.innerHTML=invoiceLines.map((l,i)=>`<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:9px 0"><label style="flex:1;min-width:150px">Stopnja DDV<select class="form-input" style="width:100%" onchange="invoiceSet(${i},'rate',this.value)">${invoiceRateOptions(l.rate)}</select></label><label style="flex:1;min-width:140px">Osnova brez DDV (€)<input class="form-input" inputmode="decimal" style="width:100%" value="${invoiceEsc(l.net)}" oninput="invoiceSet(${i},'net',this.value)"></label><button class="action-btn" onclick="invoiceRemoveLine(${i})">✕</button></div>`).join('');
 invoiceTotals();
}
function invoiceSet(i,k,v){invoiceLines[i][k]=v;invoiceTotals();}
function invoiceAddLine(){invoiceLines.push({rate:'9.5',net:''});invoiceDrawLines();}
function invoiceRemoveLine(i){if(invoiceLines.length===1)return;invoiceLines.splice(i,1);invoiceDrawLines();}
function invoiceTotals(){let net=0,vat=0;const breakdown={};for(const l of invoiceLines){const base=invoiceNum(l.net),rate=Number(l.rate);const tax=Number.isFinite(rate)?Math.round((base*rate/100+Number.EPSILON)*100)/100:0;net+=base;vat+=tax;const key=l.rate;breakdown[key]=(breakdown[key]||0)+tax;}const el=document.getElementById('invoice-totals');if(!el)return;el.innerHTML=`<div>Osnova: <b>${invoiceMoney(net)}</b></div>${Object.entries(breakdown).map(([r,v])=>`<div>DDV ${invoiceEsc(r)}${Number.isFinite(Number(r))?' %':''}: ${invoiceMoney(v)}</div>`).join('')}<hr><div><b>Skupaj: ${invoiceMoney(net+vat)}</b></div>`;}
function invoicePreviewPhoto(input){const f=input.files?.[0];if(!f)return;const el=document.getElementById('invoice-photo-preview');if(!el)return;const url=URL.createObjectURL(f);el.innerHTML='<img alt="Predogled računa" style="max-width:100%;max-height:250px;object-fit:contain;margin:10px 0">';el.querySelector('img').src=url;}

// Invoices: write real parent and VAT rows; invoice photos/OCR are not connected yet.
function invoiceRound(n){return Math.round((n+Number.EPSILON)*100)/100;}
function invoiceMessage(message){const el=document.getElementById('invoice-message');if(el)el.textContent=message;else alert(message);}
function invoiceReset(){invoiceLines=[{rate:'22',net:''}];renderInvoices();}
function invoiceLineData(){return invoiceLines.map(l=>{const osnova=invoiceRound(invoiceNum(l.net));const numeric=Number(l.rate);const stopnja=Number.isFinite(numeric)?numeric:0;const ddv=invoiceRound(osnova*stopnja/100);return {opis:null,osnova,stopnja_ddv:stopnja,ddv,skupaj:invoiceRound(osnova+ddv),ddv_obravnava:({exempt:'oprosceno',reverse:'obrnjena',outside:'ni_predmet'}[l.rate]||'obicajno')};});}
async function invoiceSave(){
 if(!isAdmin)return invoiceMessage('Samo administrator lahko shranjuje račune.');
 const partner=document.getElementById('invoice-party')?.value.trim(),stevilka=document.getElementById('invoice-number')?.value.trim(),datum=document.getElementById('invoice-date')?.value;
 if(!partner||!stevilka||!datum)return invoiceMessage('Vnesite partnerja, številko računa in datum.');
 if(invoiceLines.some(l=>!String(l.net).trim()||invoiceNum(l.net)<0))return invoiceMessage('Preverite vse osnove DDV.');
 const rows=invoiceLineData();if(!rows.length)return invoiceMessage('Dodajte vsaj eno postavko.');
 const osnova=invoiceRound(rows.reduce((a,r)=>a+r.osnova,0)),ddv=invoiceRound(rows.reduce((a,r)=>a+r.ddv,0));
 const rates=new Set(rows.map(r=>r.stopnja_ddv));
 const payload={vrsta:document.getElementById('invoice-type').value,stevilka,partner,datum,zapadlost:document.getElementById('invoice-due').value||null,osnova,ddv,skupaj:invoiceRound(osnova+ddv),stopnja_ddv:rates.size===1?[...rates][0]:null,odbitni_delez:Math.min(100,Math.max(0,invoiceNum(document.getElementById('invoice-deduct').value))),posebni_rezim:rows.some(r=>r.ddv_obravnava!=='obicajno'),placano:false,created_by:currentUser.id};
 invoiceMessage('Shranjevanje računa...');
 const {data,error}=await supabaseClient.from('sylaj_racuni').insert(payload).select('id').single();
 if(error)return invoiceMessage('Napaka pri shranjevanju: '+error.message);
 const {error:lineError}=await supabaseClient.from('sylaj_racuni_postavke').insert(rows.map(r=>({...r,racun_id:data.id})));
 if(lineError){
  const {error:undoError}=await supabaseClient.from('sylaj_racuni').update({deleted_at:new Date().toISOString(),deleted_by:currentUser.id}).eq('id',data.id);
  return invoiceMessage('Postavke niso shranjene: '+lineError.message+(undoError?' Račun je ostal v bazi: '+data.id:' Račun je označen kot izbrisan.'));
 }
 invoiceMessage('Račun shranjen. Fotografija se še ne shrani.');
}

// Ikona 8: dnevno čiščenje in ne-mehansko vzdrževanje.
let cleaningRows=[],cleaningAssets=[],cleaningFilter='vsi';
// Cleaning schedule: first and third Saturday of each month (Slovenian local time).
function cleaningSaturday(year,month,n){
 const first=new Date(year,month,1,12);const delta=(6-first.getDay()+7)%7;
 return new Date(year,month,1+delta+(n-1)*14,12);
}
function cleaningDateKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function cleaningCurrentCycle(now=new Date()){
 let candidates=[];
 for(let offset=-1;offset<=1;offset++){
  const d=new Date(now.getFullYear(),now.getMonth()+offset,1);
  for(const n of [1,3]) candidates.push(cleaningSaturday(d.getFullYear(),d.getMonth(),n));
 }
 candidates.sort((a,b)=>a-b);
 const upcoming=candidates.find(d=>now<new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0));
 const current=candidates.filter(d=>now>=new Date(d.getFullYear(),d.getMonth(),d.getDate()-2,12)).at(-1);
 return {target:current||upcoming,next:upcoming};
}
function cleaningReminderDue(now,target){
 if(!target)return false;
 const day=new Date(target.getFullYear(),target.getMonth(),target.getDate(),0);
 const diff=Math.round((new Date(now.getFullYear(),now.getMonth(),now.getDate())-day)/86400000);
 const hour=now.getHours();
 if(diff===-2)return hour>=12;
 if(diff===-1)return hour>=12;
 if(diff===0)return hour>=8;
 return diff>=1;
}
function cleaningCyclePanel(){
 const target=cleaningCurrentCycle().target;
 if(!target)return '';
 const key=cleaningDateKey(target),now=new Date();
 const completed=new Set(cleaningRows.filter(r=>r.opomba==='Termin: '+key).map(r=>r.tip+'|'+r.oprema_id));
 const due=cleaningReminderDue(now,target);
 const assets=[...cleaningAssets,{tip:'depo',id:'depo',ime:'Depo'}];
 return `<section style="border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin:14px 0"><h3>🔔 Obvezno čiščenje · ${machineEsc(key)}</h3><p>1. in 3. sobota v mesecu. Četrtek 12:00; petek 12:00, 18:00; sobota 08:00, 12:00, 15:00; od nedelje vsako uro do potrditve.</p><p style="font-size:12px">Opozorila na tej strani delujejo samo med odprto aplikacijo. Obvestila pri zaprti aplikaciji še niso aktivirana.</p>${assets.map(a=>{const done=completed.has(a.tip+'|'+a.id);const label=a.tip==='vozilo'?'Pastroje kombin / kamionin!':a.tip==='bager'?'Pastroje bagerin!':'Pastroje depon!';return `<div style="border-top:1px solid #e2e8f0;padding:9px 0"><b>${machineEsc(a.ime)}</b> · ${done?'✅ Potrjeno':due?'🔔 '+label:'⏳ V čakanju'} ${!done&&cleaningCanWrite()?`<button class="action-btn" onclick="cleaningConfirm('${machineEsc(a.tip)}','${machineEsc(a.id)}','${machineEsc(a.ime)}','${key}')">✓ Potrdi čiščenje</button>`:''}</div>`}).join('')}</section>`;
}

function cleaningAssetChanged(){const a=document.getElementById('cl-asset').value;const x=cleaningAssets.find(x=>x.tip+'|'+x.id===a);if(x){document.getElementById('cl-name').value=x.ime;document.getElementById('cl-tip').value=x.tip;}}
async function cleaningSave(id){
 if(!cleaningCanWrite()||(id&&!isAdmin))return;
 const v=k=>document.getElementById(k)?.value||'';const name=v('cl-name').trim(),worker=v('cl-worker').trim();
 if(!['bager','vozilo','depo'].includes(v('cl-tip'))){document.getElementById('cl-error').textContent='Dovoljeni so samo bagerji, vozila in depo.';return;}
 if(!name||!worker||!v('cl-date')){document.getElementById('cl-error').textContent='Vnesite opremo, datum in delavca.';return;}
 const asset=v('cl-asset').split('|');const payload={tip:v('cl-tip'),oprema_id:asset.length===2?asset[1]:null,naziv_opreme:name,datum:v('cl-date'),opravil:worker,vrsta_ciscenja:v('cl-kind'),opomba:v('cl-note').trim(),updated_by:currentUser.id};
 const res=id?await supabaseClient.from('sylaj_ciscenje').update(payload).eq('id',id):await supabaseClient.from('sylaj_ciscenje').insert({...payload,created_by:currentUser.id});
 if(res.error){document.getElementById('cl-error').textContent='Napaka: '+res.error.message;return;}
 await renderCleaning();
}

// Ikona 9: Galerija – samo ogled obstoječih slik, brez podvajanja.
let galleryFolder='',galleryItems=[],galleryName='';
const gallerySections=[['sites','🏗️ Gradbišča','Gradbišča'],['bagerji','🚜 Bagerji','Bagerji'],['vozila','🚐 Vozila','Vozila'],['depo','🧰 Depo','Depo']];
function galleryShell(title,inner){document.getElementById('content').innerHTML=`<div class="sub-header"><button class="back-btn" onclick="navigate('home')">← Nazaj</button><div class="title-area"><h2>🖼️ Galerija</h2></div><button class="home-btn" onclick="navigate('home')">⌂</button></div><div style="padding:16px;max-width:900px;margin:auto"><h3>${machineEsc(title)}</h3>${inner}</div>`;}
function renderGallery(){galleryFolder='';galleryShell('Mape fotografij',`<p>Fotografije so razdeljene po kategorijah. Računi in servisi niso del galerije.</p>${gallerySections.map(([key,icon,name])=>`<button class="action-btn" style="display:block;width:100%;text-align:left;margin:12px 0;padding:17px" onclick="galleryOpen('${key}')">📁 ${icon} ${name}　›</button>`).join('')}`);}
async function galleryOpen(key){
 galleryFolder=key;const entry=gallerySections.find(x=>x[0]===key);if(!entry)return renderGallery();
 galleryShell(entry[2],'<p>Nalaganje map...</p>');
 const type=key==='sites'?'gradbisca':key==='depo'?'orodja':key;
 const {data,error}=await supabaseClient.from(type).select('*').limit(1000);
 if(error){galleryShell(entry[2],`<button class="action-btn" onclick="renderGallery()">← Mape</button><p style="color:#b91c1c">${machineEsc(error.message)}</p>`);return;}
 const items=(data||[]).filter(r=>!r.izbrisano_at).sort((a,b)=>String(a.naziv||'').localeCompare(String(b.naziv||'')));
 galleryItems=items;
 galleryShell(entry[2],`<button class="action-btn" onclick="renderGallery()">← Mape</button><p>Izberite mapo. Fotografije ostanejo shranjene v izvirnih modulih.</p><input class="form-input" style="width:100%;margin:10px 0" placeholder="🔎 Išči po imenu" oninput="galleryFilterFolders(this.value)"><div id="gallery-folders"></div>`);
 galleryFilterFolders('');
}
function galleryFilterFolders(q){const el=document.getElementById('gallery-folders');if(!el)return;const matches=galleryItems.map((r,i)=>({r,i})).filter(({r})=>String(r.naziv||r.ime||'').toLowerCase().includes(q.toLowerCase()));el.innerHTML=matches.map(({r,i})=>`<button class="action-btn" style="display:block;width:100%;text-align:left;margin:8px 0;padding:12px" onclick="galleryShowItem(${i})">📁 ${machineEsc(r.naziv||r.ime||r.id)}　›</button>`).join('')||'<p>Ni map.</p>';}
async function galleryShowItem(index){
 const r=galleryItems[index];if(!r)return;const folder=galleryFolder;
 const title=r.naziv||r.ime||String(r.id);
 galleryShell(title,`<button class="action-btn" onclick="galleryOpen('${folder}')">← ${machineEsc(gallerySections.find(x=>x[0]===folder)?.[2]||'Mape')}</button><p id="gallery-status">Nalaganje fotografij...</p><div id="gallery-photos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px"></div>`);
 const status=document.getElementById('gallery-status'),grid=document.getElementById('gallery-photos');
 let photos=[];let errors=[];
 if(folder==='sites'){
  const {data,error}=await supabaseClient.from('sylaj_site_photos').select('storage_path,created_at').eq('site_id',String(r.id)).order('created_at',{ascending:false}).limit(300);
  if(error)errors.push(error.message);else photos=(data||[]).map(x=>({...x,bucket:'sylaj-site-photos'}));
 }else if(folder==='bagerji'||folder==='vozila'){
  const {data,error}=await supabaseClient.from('sylaj_machine_photos').select('storage_path').eq('machine_type',folder).eq('machine_id',String(r.id));
  if(error)errors.push(error.message);else photos=(data||[]).map(x=>({...x,bucket:'sylaj-machine-photos'}));
 }else if(folder==='depo'){
  // Kataloška fotografija orodja; dokazne fotografije prevzemov ostanejo v Depo.
  if(r.fotografija&&/^https?:\/\//.test(r.fotografija))photos.push({url:r.fotografija});
 }
 let shown=0;
 for(const photo of photos){
  let url=photo.url;
  if(!url){const {data,error}=await supabaseClient.storage.from(photo.bucket).createSignedUrl(photo.storage_path,3600);if(error){errors.push(error.message);continue;}url=data?.signedUrl;}
  if(!url)continue;
  const card=document.createElement('div');card.style.cssText='border:1px solid #cbd5e1;border-radius:10px;padding:8px;overflow:hidden';
  const img=document.createElement('img');img.src=url;img.alt=title;img.loading='lazy';img.style.cssText='width:100%;height:125px;object-fit:cover;border-radius:8px';
  const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='Odpri / prenesi';link.style.cssText='display:block;margin-top:6px;font-size:13px';
  const share=document.createElement('button');share.className='action-btn';share.textContent='Deli';share.onclick=async()=>{try{if(navigator.share)await navigator.share({title,url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Povezava kopirana.');}else prompt('Kopirajte povezavo:',url);}catch(e){if(e.name!=='AbortError')alert('Deljenje ni uspelo.');}};
  card.append(img,link,share);grid.append(card);shown++;
 }
 status.textContent=errors.length?'Nekaterih fotografij ni mogoče prikazati: '+errors[0]:(shown?shown+' fotografij':'V tej mapi še ni fotografij.');
}

const EMP_DOC_BUCKET='sylaj-employee-documents';
let employeeDocWorkers=[],employeeDocRows=[],employeeDocSelected=null;
async function renderEmployeeDocs(){

 el.innerHTML='<div class="empty-state">Nalaganje dokumentov...</div>';

 el.innerHTML=`<div class="sub-header"><button class="back-btn" onclick="navigate('home')">← Nazaj</button><div class="title-area"><h2>📁 Dokumenti zaposlenih</h2></div><button class="home-btn" onclick="navigate('home')">⌂</button></div><div style="padding:16px;max-width:850px;margin:auto"><p>🔒 Zaupno. Samo administrator lahko vidi dokumente.</p><input class="form-input" style="width:100%" placeholder="🔎 Išči zaposlenega" oninput="employeeDocFilter(this.value)"><p id="empdoc-status" style="color:#b91c1c"></p><div id="empdoc-list"></div></div>`;

function employeeDocFilter(term){const el=document.getElementById('empdoc-list');if(!el)return;el.innerHTML=employeeDocWorkers.filter(w=>w.ime_priimek.toLowerCase().includes(String(term).toLowerCase())).map(w=>`<button class="action-btn" style="display:block;width:100%;text-align:left;margin:8px 0;padding:14px" onclick="employeeDocOpen('${w.id}')">📁 ${machineEsc(w.ime_priimek)} ›</button>`).join('')||'<p>Ni zaposlenih.</p>';}
async function employeeDocOpen(workerId){
 if(!isAdmin)return;employeeDocSelected=employeeDocWorkers.find(w=>String(w.id)===String(workerId));if(!employeeDocSelected)return;
 const el=document.getElementById('empdoc-list');el.innerHTML='<p>Nalaganje dokumentov...</p>';
 const {data,error}=await supabaseClient.from('sylaj_employee_documents').select('*').eq('delavec_id',workerId).is('deleted_at',null).order('created_at',{ascending:false});
 employeeDocRows=data||[];
 el.innerHTML=`<button class="action-btn" onclick="employeeDocFilter('')">← Zaposleni</button><h3>📁 ${machineEsc(employeeDocSelected.ime_priimek)}</h3><label>Vrsta dokumenta <select id="empdoc-type" class="form-input" style="width:100%"><option>Pogodba o zaposlitvi</option><option>Delovno dovoljenje</option><option>Usposabljanje / varnost</option><option>Zdravniško spričevalo</option><option>Drugo</option></select></label><label>Veljavnost do (neobvezno) <input id="empdoc-expiry" class="form-input" type="date" style="width:100%"></label><label>Izberi dokument (PDF ali slika) <input id="empdoc-file" class="form-input" type="file" accept="application/pdf,image/jpeg,image/png,image/webp" style="width:100%"></label><button class="action-btn" onclick="employeeDocUpload()">⬆️ Naloži dokument</button><p id="empdoc-msg" style="color:#b91c1c"></p><h3>Shranjeni dokumenti</h3><div id="empdoc-files"></div>`;

function employeeDocDraw(){const el=document.getElementById('empdoc-files');if(!el)return;el.innerHTML=employeeDocRows.length?employeeDocRows.map((r,i)=>`<div style="border:1px solid #cbd5e1;border-radius:9px;padding:12px;margin:8px 0"><b>${machineEsc(r.vrsta)}</b><p>${machineEsc(r.ime_datoteke)}${r.velja_do?' · Velja do: '+machineEsc(r.velja_do):''}</p><button class="action-btn" onclick="employeeDocView(${i})">👁️ Odpri</button> <button class="action-btn" onclick="employeeDocArchive(${i})">🗄️ Arhiviraj</button></div>`).join(''):'<p>Ni dokumentov.</p>';}
async function employeeDocUpload(){
 if(!isAdmin||!employeeDocSelected)return;
 const file=document.getElementById('empdoc-file')?.files?.[0],msg=document.getElementById('empdoc-msg');
 if(!file)return msg.textContent='Izberite datoteko.';
 if(!['application/pdf','image/jpeg','image/png','image/webp'].includes(file.type))return msg.textContent='Dovoljeni so PDF, JPG, PNG in WEBP.';
 if(file.size>15*1024*1024)return msg.textContent='Datoteka je prevelika (največ 15 MB).';
 msg.textContent='Nalaganje...';
 const path=String(employeeDocSelected.id)+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
 const {error:upError}=await supabaseClient.storage.from(EMP_DOC_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
 if(upError)return msg.textContent='Napaka pri nalaganju: '+upError.message;
 const {error:dbError}=await supabaseClient.from('sylaj_employee_documents').insert({delavec_id:employeeDocSelected.id,vrsta:document.getElementById('empdoc-type').value,ime_datoteke:file.name,storage_path:path,velja_do:document.getElementById('empdoc-expiry').value||null,created_by:currentUser.id});
 if(dbError){await supabaseClient.storage.from(EMP_DOC_BUCKET).remove([path]);return msg.textContent='Napaka pri shranjevanju: '+dbError.message;}
 await employeeDocOpen(employeeDocSelected.id);
}
async function employeeDocView(i){if(!isAdmin)return;const r=employeeDocRows[i];if(!r)return;const {data,error}=await supabaseClient.storage.from(EMP_DOC_BUCKET).createSignedUrl(r.storage_path,120);if(error)return alert(error.message);window.open(data.signedUrl,'_blank','noopener');}
async function employeeDocArchive(i){if(!isAdmin)return;const r=employeeDocRows[i];if(!r||!confirm('Arhiviram dokument? Datoteka ostane shranjena.'))return;const {error}=await supabaseClient.from('sylaj_employee_documents').update({deleted_at:new Date().toISOString()}).eq('id',r.id);if(error)return alert(error.message);await employeeDocOpen(employeeDocSelected.id);}

 ['workers','👷','Delavci in ekipe','Punëtorët dhe ekipet','Workers and teams'],
 ['hours','🕐','Evidenca ur','Orët e punës','Working hours'],
 ['sites','🏗️','Gradbišča','Kantieret','Sites'],
 ['machines','🚜','Stroji in vozila','Makineritë dhe automjetet','Machines and vehicles'],
 ['fuel','⛽','Gorivo','Nafta','Fuel'],
 ['depot','🏠','Depo','Depo','Depot'],
 ['invoices','🧾','Računi','Faturat','Invoices'],
 ['services','🔧','Servisi','Serviset','Services'],
 ['cleaning','🧹','Čiščenje','Pastrimi','Cleaning'],
 ['gallery','🖼️','Galerija','Galeria','Gallery'],
 ['docs','📁','Dokumenti zaposlenih','Dokumentet e punëtorëve','Employee documents'],

];
function sylajNavText(sl,sq,en){return currentLang==='sq'?sq:currentLang==='en'?en:sl;}
function sylajNavEscape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sylajNavLinks(rows){return rows.map(([id,emoji,sl,sq,en])=>`<button type="button" class="action-btn" style="display:block;width:100%;text-align:left;margin:8px 0;padding:14px" onclick="navigate('${id}')">${emoji} ${sylajNavEscape(sylajNavText(sl,sq,en))} ›</button>`).join('');}

 const c=document.getElementById('content');
 c.innerHTML=`<div style="padding:18px"><h2>${sylajNavText('Iskanje','Kërkimi','Search')}</h2><input id="sylaj-search-input" class="form-input" style="width:100%;padding:12px" type="search" placeholder="${sylajNavText('Poiščite modul','Kërko modulin','Find a module')}" aria-label="${sylajNavText('Poiščite modul','Kërko modulin','Find a module')}"><div id="sylaj-search-results"></div></div>`;
 const input=document.getElementById('sylaj-search-input');
 const draw=()=>{const q=input.value.trim().toLocaleLowerCase();const rows=sylajQuickModules.filter(r=>r.slice(2).some(v=>v.toLocaleLowerCase().includes(q)));document.getElementById('sylaj-search-results').innerHTML=rows.length?sylajNavLinks(rows):`<p>${sylajNavText('Ni rezultatov','Nuk ka rezultate','No results')}</p>`;};
 input.addEventListener('input',draw);draw();input.focus();
}
function renderNavAdd(){

 c.innerHTML=`<div style="padding:18px"><h2>${sylajNavText('Hitri dostop','Hyrje e shpejtë','Quick access')}</h2><p>${sylajNavText('Izberite modul za nov vnos.','Zgjidh modulin ku dëshiron të regjistrosh të dhëna.','Choose a module to enter information.')}</p>${sylajNavLinks(sylajQuickModules.filter(r=>['hours','sites','machines','depot','invoices','fuel','services','cleaning','calendar'].includes(r[0])))}</div>`;
}
function navigate(page) {
 if(typeof depotStopInlineCamera === "function")depotStopInlineCamera();
  const content = document.getElementById('content');
  const banner = document.getElementById('home-banner');
  if (!content) return;
  if (page === 'home') {
    if (banner) banner.style.display = 'block';
    renderHome();
  } else {
    if (banner) banner.style.display = 'none';
    if (page === 'search') renderNavSearch();
    else if (page === 'add') renderNavAdd();
    else if (page === 'hours') renderHours();
    else if (page === 'workers') renderWorkers();
    else if (page === 'sites') renderSites();
    else if (page === 'machines') renderMachines();
    else if (page === 'fuel') renderFuel();
    else if (page === 'depot') renderDepot();
    else if (page === 'invoices') renderInvoices();
    else if (page === 'services') renderServices();
    else if (page === 'cleaning') renderCleaning();
    else if (page === 'gallery') renderGallery();
    else if (page === 'docs') renderEmployeeDocs();
    else if (page === 'calendar') renderCalendar();
    else if (page === 'profile') renderProfile();
    else if (page === 'reports' || page === 'reportsMod') renderReports();
    else content.innerHTML = `<div class="empty-state"><p>${t('noData')} – modul v pripravi</p></div>`;
  }
}

async function renderHome() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="empty-state"><p>${t('loading')}</p></div>`;

 else html+='<p>Vnos trenutno omogočen samo administratorju, dokler ne uredimo varnostnih pravil za vodje ekip.</p>';

 const history=document.getElementById('machine-daily-history');if(!history||!panel.isConnected)return;

 history.innerHTML=`<p><b>Skupaj prikazani vnosi:</b> ${sumH.toFixed(2)} h · ${sumL.toFixed(2)} L</p><div class="table-wrap"><table><thead><tr><th>Datum</th><th>Ure</th><th>Gorivo</th><th>Opomba</th><th></th></tr></thead><tbody>${data.map(x=>`<tr><td>${machineEsc(x.datum)}</td><td>${(Number(x.ure_konec)-Number(x.ure_zacetek)).toFixed(2)} h<br><small>${machineEsc(x.ure_zacetek)} → ${machineEsc(x.ure_konec)}</small></td><td>${machineEsc(x.litri)} L</td><td>${machineEsc(x.opomba||'')}</td><td>${allowed?`<button class="action-btn" onclick="machineDailyDelete(${index},'${machineEsc(x.id)}')">Izbriši</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;

// Fuel overview: excavator fuel from sylaj_bager_dnevnik; vehicle/team-only fuel from sylaj_gorivo_vnosi.
// One record has one quantity and optional team: never add category subtotals together.
let fuelEntries=[],fuelMachines={bagerji:[],vozila:[]},fuelTeams=[];
function fuelTxt(sl,sq,en){return sylajNavText(sl,sq,en);}
function fuelNum(n){return (Number(n)||0).toLocaleString('sl-SI',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fuelISO(){return new Date().toLocaleDateString('sv-SE');}
function fuelDateValid(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v+'T12:00:00'));}
async function fuelFetchAll(table,fields,filters){let all=[];for(let start=0;start<100000;start+=1000){let q=supabaseClient.from(table).select(fields).order('datum',{ascending:false}).range(start,start+999);if(filters)q=filters(q);const {data,error}=await q;if(error)throw error;all.push(...(data||[]));if((data||[]).length<1000)break;}return all;}
async function fuelLoad(){
 await loadTeams();fuelTeams=state.cache.teams||[];
 const [br,vr]=await Promise.all([supabaseClient.from('bagerji').select('*').limit(1000),supabaseClient.from('vozila').select('*').limit(1000)]);
 if(br.error)throw br.error;if(vr.error)throw vr.error;
 fuelMachines={bagerji:br.data||[],vozila:vr.data||[]};
 const [b,v]=await Promise.all([fuelFetchAll('sylaj_bager_dnevnik','id,bager_id,datum,litri,ure_zacetek,ure_konec,ekipa_id,opomba'),fuelFetchAll('sylaj_gorivo_vnosi','id,datum,litri,vozilo_id,ekipa_id,km_stanje,opomba')]);
 fuelEntries=[...b.map(r=>({...r,kind:'bagerji',machineId:String(r.bager_id)})),...v.map(r=>({...r,kind:r.vozilo_id?'vozila':'ekipa',machineId:r.vozilo_id==null?'':String(r.vozilo_id)}))];
}
function fuelMachine(r){let m=(fuelMachines[r.kind]||[]).find(x=>String(x.id)===r.machineId);return m?machineLabel(m,r.kind):(r.kind==='ekipa'?'—':r.machineId);}
function fuelPlate(r){let m=(fuelMachines[r.kind]||[]).find(x=>String(x.id)===r.machineId);return m?.registracija||m?.registrska_oznaka||'';}
function fuelTeam(r){let t=fuelTeams.find(x=>String(x.id)===String(r.ekipa_id));return t?.naziv||t?.ime||(r.ekipa_id?'#'+r.ekipa_id:'—');}
function fuelPeriodRows(){const y=document.getElementById('fuel-year')?.value||String(new Date().getFullYear());const month=document.getElementById('fuel-month')?.value||'all';return fuelEntries.filter(r=>r.datum?.startsWith(y+(month==='all'?'':'-'+month)));}
function fuelGroup(rows,by){const map=new Map();for(const r of rows){const key=by(r);const old=map.get(key)||{name:key,litri:0,count:0};old.litri+=Number(r.litri)||0;old.count++;map.set(key,old);}return [...map.values()].sort((a,b)=>b.litri-a.litri);}
function fuelSummaryTable(rows){return `<div class="table-wrap"><table><thead><tr><th>${fuelTxt('Naziv','Emri','Name')}</th><th>${fuelTxt('Vnosi','Regjistrime','Entries')}</th><th>Litri</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${machineEsc(x.name)}</td><td>${x.count}</td><td>${fuelNum(x.litri)} L</td></tr>`).join(''):'<tr><td colspan="3">Ni podatkov</td></tr>'}</tbody></table></div>`;}
function fuelDraw(){const rows=fuelPeriodRows(),target=document.getElementById('fuel-results');if(!target)return;
 const b=rows.filter(x=>x.kind==='bagerji'),v=rows.filter(x=>x.kind==='vozila');
 const teams=fuelGroup(rows.filter(x=>x.ekipa_id!=null),fuelTeam);
 target.innerHTML=`<h3>⛽ ${fuelTxt('Skupaj','Gjithsej','Total')}: ${fuelNum(rows.reduce((s,r)=>s+Number(r.litri||0),0))} L</h3><p style="font-size:12px;color:#64748b">${fuelTxt('Vsak vnos je v skupnem seštevku štet samo enkrat. Vnosi brez ekipe ostanejo brez ekipe.','Çdo regjistrim numërohet vetëm një herë. Regjistrimet pa ekip nuk caktohen automatikisht.','Each entry counts once. Unassigned entries remain unassigned.')}</p><h3>🚜 ${fuelTxt('Bagerji','Bagerët','Excavators')}</h3>${fuelSummaryTable(fuelGroup(b,r=>fuelMachine(r)))}<h3>🚐 ${fuelTxt('Vozila in registracije','Automjetet dhe targat','Vehicles and plates')}</h3>${fuelSummaryTable(fuelGroup(v,r=>fuelMachine(r)+(fuelPlate(r)?' · '+fuelPlate(r):'')))}<h3>👷 ${fuelTxt('Ekipe','Ekipet','Teams')}</h3>${fuelSummaryTable(teams)}<h3>📅 ${fuelTxt('Vsi vnosi','Të gjitha regjistrimet','All entries')}</h3><div class="table-wrap"><table><thead><tr><th>Datum</th><th>${fuelTxt('Vrsta','Lloji','Type')}</th><th>${fuelTxt('Stroj / vozilo','Makina / automjeti','Machine / vehicle')}</th><th>${fuelTxt('Registracija','Targa','Plate')}</th><th>Ekipa</th><th>Litri</th><th>h / km</th></tr></thead><tbody>${rows.sort((a,b)=>b.datum.localeCompare(a.datum)).map(r=>`<tr><td>${machineEsc(r.datum)}</td><td>${machineEsc(r.kind)}</td><td>${machineEsc(fuelMachine(r))}</td><td>${machineEsc(fuelPlate(r))}</td><td>${machineEsc(fuelTeam(r))}</td><td>${fuelNum(r.litri)}</td><td>${r.kind==='bagerji'?fuelNum(Number(r.ure_konec)-Number(r.ure_zacetek))+' h':r.km_stanje==null?'—':machineEsc(r.km_stanje)+' km'}</td></tr>`).join('')}</tbody></table></div>`;
}
async function renderFuel(){const el=document.getElementById('content');el.innerHTML=`<div class="sub-header"><button class="back-btn" onclick="navigate('home')">←</button><div class="title-area"><h2>⛽ ${fuelTxt('Gorivo','Nafta','Fuel')}</h2></div></div><div style="padding:14px" id="fuel-body">${fuelTxt('Nalaganje','Duke ngarkuar','Loading')}...</div>`;

// Machine photo storage: one current photo per machine; private signed URLs.
const MACHINE_PHOTO_BUCKET='sylaj-machine-photos';
function machinePhotoKey(type,id){return type+':'+String(id);}
async function machineGetPhoto(type,id){
 const key=machinePhotoKey(type,id);
 if(machinePhotoUrls[key])return machinePhotoUrls[key];
 const {data,error}=await supabaseClient.from('sylaj_machine_photos').select('storage_path').eq('machine_type',type).eq('machine_id',String(id)).maybeSingle();
 if(error)throw error;
 if(!data?.storage_path)return null;
 const {data:link,error:linkErr}=await supabaseClient.storage.from(MACHINE_PHOTO_BUCKET).createSignedUrl(data.storage_path,3600);
 if(linkErr)throw linkErr;
 machinePhotoUrls[key]=link.signedUrl;
 return link.signedUrl;
}
async function machineLoadThumbnails(){
 const requests=[];
 for(const type of ['bagerji','vozila'])for(let i=0;i<(machineRows[type]||[]).length;i++){
  const r=machineRows[type][i];
  requests.push((async()=>{
   const holder=document.getElementById(`machine-thumb-${type}-${i}`);if(!holder)return;
   try{const url=await machineGetPhoto(type,r.id);
    if(url&&holder.isConnected){const img=document.createElement('img');img.src=url;img.alt='Fotografija '+machineLabel(r,type);holder.replaceChildren(img);}
   }catch(e){/* No schema or permissions yet; keep icon fallback */ }
  })());
 }
 await Promise.allSettled(requests);
}
async function machineShowPhoto(type,index){
 const r=machineRows[type]?.[index];if(!r)return;
 const large=document.getElementById('machine-photo-large'),actions=document.getElementById('machine-photo-actions'),status=document.getElementById('machine-photo-status');
 if(!large||!actions||!status)return;
 if(machineMayEdit(r)){
  actions.innerHTML=`<label class="action-btn" style="cursor:pointer">📷 Fotografiraj<input type="file" accept="image/*" capture="environment" style="display:none" onchange="machineUploadPhoto('${type}',${index},this)"></label><label class="action-btn" style="cursor:pointer">🖼️ Izberi iz galerije<input type="file" accept="image/*" style="display:none" onchange="machineUploadPhoto('${type}',${index},this)"></label><button class="action-btn" onclick="machineDeletePhoto('${type}',${index})">Odstrani fotografijo</button>`;
 }
 try{
  const url=await machineGetPhoto(type,r.id);
  if(url&&large.isConnected){const img=document.createElement('img');img.src=url;img.alt='Fotografija '+machineLabel(r,type);large.replaceChildren(img);}
  else status.textContent='Fotografija še ni dodana.';
 }catch(e){status.textContent='Fotografije še niso pripravljene v Supabase: '+e.message;}
}
async function machineUploadPhoto(type,index,input){
 const r=machineRows[type]?.[index];if(!r||!machineMayEdit(r))return;
 const file=input.files?.[0],status=document.getElementById('machine-photo-status');
 if(!file)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){alert('Dovoljene so fotografije JPG, PNG ali WebP do 8 MB.');input.value='';return;}
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const path=`${type}/${r.id}/${crypto.randomUUID()}.${ext}`;
 try{
  if(status)status.textContent='Nalaganje fotografije...';
  const bucket=supabaseClient.storage.from(MACHINE_PHOTO_BUCKET);
  const {error:uploadErr}=await bucket.upload(path,file,{contentType:file.type,upsert:false});
  if(uploadErr)throw uploadErr;
  const {data:old,error:readErr}=await supabaseClient.from('sylaj_machine_photos').select('storage_path').eq('machine_type',type).eq('machine_id',String(r.id)).maybeSingle();
  if(readErr){await bucket.remove([path]);throw readErr;}
  const {error:saveErr}=await supabaseClient.from('sylaj_machine_photos').upsert({machine_type:type,machine_id:String(r.id),storage_path:path,updated_by:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'machine_type,machine_id'});
  if(saveErr){await bucket.remove([path]);throw saveErr;}
  if(old?.storage_path)await bucket.remove([old.storage_path]);
  delete machinePhotoUrls[machinePhotoKey(type,r.id)];
  await machineShowPhoto(type,index);
 }catch(e){if(status)status.textContent='Napaka: '+e.message;}
 input.value='';
}
async function machineDeletePhoto(type,index){
 const r=machineRows[type]?.[index];if(!r||!machineMayEdit(r)||!confirm('Odstranim fotografijo?'))return;
 const status=document.getElementById('machine-photo-status');
 try{
  const {data,error}=await supabaseClient.from('sylaj_machine_photos').select('storage_path').eq('machine_type',type).eq('machine_id',String(r.id)).maybeSingle();
  if(error)throw error;if(!data)return;
  const {error:deleteErr}=await supabaseClient.from('sylaj_machine_photos').delete().eq('machine_type',type).eq('machine_id',String(r.id));
  if(deleteErr)throw deleteErr;
  await supabaseClient.storage.from(MACHINE_PHOTO_BUCKET).remove([data.storage_path]);
  delete machinePhotoUrls[machinePhotoKey(type,r.id)];
  const large=document.getElementById('machine-photo-large');if(large)large.textContent=type==='bagerji'?'🚜':'🚚';
  if(status)status.textContent='Fotografija odstranjena.';
 }catch(e){if(status)status.textContent='Napaka: '+e.message;}
}

  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  depotCameraStream=stream;
  const video=document.getElementById('depot-camera-video');
  if(!video){stream.getTracks().forEach(t=>t.stop());depotCameraStream=null;return;}
  video.srcObject=stream;area.style.display='block';await video.play();
  if(status)status.textContent='Usmerite kamero v orodje in pritisnite Fotografiraj.';
 }catch(e){depotStopInlineCamera();if(status)status.textContent='Kamera: '+(e.message||e)+'. Poskusite Galerija.';}
}
function depotStopInlineCamera(){
 if(depotCameraStream){depotCameraStream.getTracks().forEach(t=>t.stop());depotCameraStream=null;}
 const area=document.getElementById('depot-camera-area');if(area)area.style.display='none';
 const video=document.getElementById('depot-camera-video');if(video)video.srcObject=null;
}
function depotCaptureInlineCamera(){
 const video=document.getElementById('depot-camera-video');
 const status=document.getElementById('depot-new-status');
 if(!video||!video.videoWidth){if(status)status.textContent='Kamera še ni pripravljena.';return;}
 const canvas=document.createElement('canvas');
 const scale=Math.min(1,1600/Math.max(video.videoWidth,video.videoHeight));
 canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
 canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
 canvas.toBlob(blob=>{
  if(!blob){if(status)status.textContent='Fotografije ni bilo mogoče zajeti.';return;}
  depotNewFile=new File([blob],'orodje-'+Date.now()+'.jpg',{type:'image/jpeg'});
  depotAIConfirmed=false;
  const preview=document.getElementById('depot-new-preview');
  if(preview){preview.innerHTML='<img style="width:130px;height:130px;object-fit:cover;border-radius:12px;margin:12px 0" alt="Fotografija orodja">';preview.querySelector('img').src=URL.createObjectURL(blob);}
  const aiBtn=document.getElementById('depot-ai-button');if(aiBtn)aiBtn.disabled=false;
  if(status)status.textContent='Fotografija je pripravljena. Izpolnite podatke in pritisnite Shrani orodje.';
  depotStopInlineCamera();
 },'image/jpeg',0.82);
}

async function depotImageForAI(file){

 const scale=Math.min(1,1024/Math.max(bmp.width,bmp.height));
 const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));
 canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();
 return canvas.toDataURL('image/jpeg',0.74);
}

async function fetchHoursYear(year){
 const start=year+'-01-01',end=(Number(year)+1)+'-01-01';
 if(!isAdmin&&!userTeamIds.length)return [];
 const result=[];
 for(let offset=0;offset<100000;offset+=1000){
  let q=supabaseClient.from('delovne_ure').select('id,datum,delavec_id,ekipa_id,gradbisce_id,zacetek,konec,opomba,malica_zacetek,malica_konec')
   .is('izbrisano_at',null).gte('datum',start).lt('datum',end).order('datum',{ascending:true}).order('id',{ascending:true}).range(offset,offset+999);
  if(!isAdmin)q=q.in('ekipa_id',userTeamIds);
  const {data,error}=await q;if(error)throw error;
  result.push(...(data||[]));if(!data||data.length<1000)break;
 }
 return result;
}

async function showHoursOverview(mode){

 try{
  const year=String(state.hoursFilter.month).slice(0,4);

  const filtered=records.filter(r=>(state.hoursFilter.worker==='all'||String(r.delavec_id)===String(state.hoursFilter.worker))&&(state.hoursFilter.team==='all'||String(r.ekipa_id)===String(state.hoursFilter.team))&&(state.hoursFilter.site==='all'||String(r.gradbisce_id)===String(state.hoursFilter.site)));
  const workers=state.cache.workers,sites=state.cache.sites;
  let rows=[];
  if(mode==='month'){
   const days=new Date(Number(year),Number(state.hoursFilter.month.slice(5,7)),0).getDate();
   rows=[['Delavec',...Array.from({length:days},(_,i)=>String(i+1)),'Skupaj']];
   const ids=[...new Set(filtered.map(x=>String(x.delavec_id)))];
   for(const id of ids){const daily=Array(days).fill(0);filtered.filter(x=>String(x.delavec_id)===id).forEach(x=>daily[Number(x.datum.slice(-2))-1]+=calcHours(x.zacetek,x.konec));rows.push([hourName(workers,id,'ime_priimek'),...daily.map(v=>v?v.toFixed(2):'–'),daily.reduce((a,b)=>a+b,0).toFixed(2)]);}
  }else if(mode==='year'){
   rows=[['Delavec',...Array.from({length:12},(_,i)=>String(i+1)),'Skupaj']];
   const ids=[...new Set(filtered.map(x=>String(x.delavec_id)))];
   for(const id of ids){const monthly=Array(12).fill(0);filtered.filter(x=>String(x.delavec_id)===id).forEach(x=>monthly[Number(x.datum.slice(5,7))-1]+=calcHours(x.zacetek,x.konec));rows.push([hourName(workers,id,'ime_priimek'),...monthly.map(v=>v.toFixed(2)),monthly.reduce((a,b)=>a+b,0).toFixed(2)]);}
  }else{
   const workerMode=mode==='workers', map=new Map();
   for(const r of filtered){const id=String(workerMode?r.delavec_id:r.gradbisce_id||'');map.set(id,(map.get(id)||0)+calcHours(r.zacetek,r.konec));}
   rows=[[workerMode?'Delavec':'Gradbišče','Skupaj ur'],...[...map].map(([id,n])=>[hourName(workerMode?workers:sites,id,workerMode?'ime_priimek':'naziv'),n.toFixed(2)])];
  }

  const monthMap=new Map();
  for(const r of [...records].sort((a,b)=>String(a.datum).localeCompare(String(b.datum)) || Number(a.id)-Number(b.id))){

   const key=JSON.stringify([r.delavec_id,w]);if(!monthMap.has(key))monthMap.set(key,Array(12).fill(0));monthMap.get(key)[Number(r.datum.slice(5,7))-1]+=h;
  }
  const annual=[['Delavec',...Array.from({length:12},(_,i)=>year+'-'+String(i+1).padStart(2,'0')),'Skupaj']];
  for(const [key,values] of monthMap)annual.push([JSON.parse(key)[1],...values.map(v=>Math.round(v*100)/100),Math.round(values.reduce((a,b)=>a+b,0)*100)/100]);
  const book=XLSX.utils.book_new();for(const [name,data] of [['Dnevno',rows],['Letni pregled',annual]]){const ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=data[0].map((_,i)=>({wch:i===1?26:16}));XLSX.utils.book_append_sheet(book,ws,name);}
  XLSX.writeFile(book,'SYLAJ-Delovne-ure-'+year+'.xlsx');
 }catch(e){alert('Napaka pri Excel izvozu: '+e.message);}

function generateMonthOptions(selected) {
  const opts = [];
  const now = new Date();
  // Selected month must always be available, including after a year change.
  if (selected && selected > localMonthKey(now)) opts.push(`<option value="${selected}" selected>${selected}</option>`);
  for (let i = 0; i < 18; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = localMonthKey(d);
    const label = d.toLocaleDateString('sl', { year: 'numeric', month: 'long' });
    opts.push(`<option value="${val}" ${val===selected?'selected':''}>${label}</option>`);
  }
  return opts.join('');
}

function formatDate(d) {
  if (!d) return '';
  const [y,m,day] = d.toString().split('-');
  return `${day}.${m}.${y}`;
}

function workerEntryMinutes(e){
 if(!e.zacetek||!e.konec)return null;
 const parse=t=>{const parts=String(t).split(':');return Number(parts[0])*60+Number(parts[1]);};
 const diff=parse(e.konec)-parse(e.zacetek);
 return Number.isFinite(diff)&&diff>=0?diff:null;
}

const WORKER_PHOTO_BUCKET='sylaj-worker-profiles';
async function workerLoadPhoto(id){
 const avatar=document.getElementById('workerProfileAvatar');
 const actions=document.getElementById('workerPhotoActions');
 const status=document.getElementById('workerPhotoStatus');
 if(!avatar||!actions||!status)return;
 if(isAdmin){
  actions.innerHTML=`<label class="worker-action">📷 Fotografiraj<input type="file" accept="image/*" capture="environment" style="display:none" onchange="workerUploadPhoto('${workerEsc(id)}',this)"></label>
  <label class="worker-action">🖼️ Izberi iz galerije<input type="file" accept="image/*" style="display:none" onchange="workerUploadPhoto('${workerEsc(id)}',this)"></label>
  <button class="worker-action danger" onclick="workerDeletePhoto('${workerEsc(id)}')">Odstrani fotografijo</button>`;
 }
 try{
  const {data,error}=await supabaseClient.from('sylaj_worker_photos').select('storage_path').eq('worker_id',id).maybeSingle();
  if(error)throw error;
  if(!data?.storage_path){status.textContent='Fotografija še ni dodana.';return;}
  const {data:link,error:linkError}=await supabaseClient.storage.from(WORKER_PHOTO_BUCKET).createSignedUrl(data.storage_path,3600);
  if(linkError)throw linkError;
  const img=document.createElement('img');img.alt='Fotografija delavca';img.src=link.signedUrl;
  avatar.replaceChildren(img);
  status.textContent='';
 }catch(e){status.textContent='Fotografije še niso povezane z bazo. Potrebna je SQL migracija in zasebni bucket.';console.warn('Worker photo:',e.message);}
}
async function workerUploadPhoto(id,input){
 if(!isAdmin||!currentUser)return;
 const file=input.files?.[0];if(!file)return;
 const status=document.getElementById('workerPhotoStatus');
 if(!file.type.startsWith('image/'))return alert('Izberite fotografijo.');
 if(file.size>8*1024*1024)return alert('Fotografija mora biti manjša od 8 MB.');
 if(status)status.textContent='Nalaganje fotografije...';
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const path=`${id}/${crypto.randomUUID()}.${ext}`;
 try{
  const bucket=supabaseClient.storage.from(WORKER_PHOTO_BUCKET);
  const {error:uploadError}=await bucket.upload(path,file,{contentType:file.type,upsert:false});
  if(uploadError)throw uploadError;
  const {data:previous}=await supabaseClient.from('sylaj_worker_photos').select('storage_path').eq('worker_id',id).maybeSingle();
  const {error:saveError}=await supabaseClient.from('sylaj_worker_photos').upsert({worker_id:id,storage_path:path,updated_by:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'worker_id'});
  if(saveError){await bucket.remove([path]);throw saveError;}
  if(previous?.storage_path)await bucket.remove([previous.storage_path]);
  await workerLoadPhoto(id);
 }catch(e){if(status)status.textContent='Napaka: '+e.message;}
 input.value='';
}
async function workerDeletePhoto(id){
 if(!isAdmin||!confirm('Odstranim fotografijo delavca?'))return;
 const status=document.getElementById('workerPhotoStatus');

  const {data,error}=await supabaseClient.from('sylaj_worker_photos').select('storage_path').eq('worker_id',id).maybeSingle();
  if(error)throw error;
  if(!data)return;
  const {error:delError}=await supabaseClient.from('sylaj_worker_photos').delete().eq('worker_id',id);

  await supabaseClient.storage.from(WORKER_PHOTO_BUCKET).remove([data.storage_path]);

  await workerLoadPhoto(id);
 }catch(e){if(status)status.textContent='Napaka: '+e.message;}
}

async function siteReadHours(id){
 const all=[];let from=0;const pageSize=500;
 for(let page=0;page<100;page++){
  let q=supabaseClient.from('delovne_ure').select('id,datum,delavec_id,ekipa_id,zacetek,konec,opomba').eq('gradbisce_id',id).is('izbrisano_at',null).order('datum',{ascending:true}).order('id',{ascending:true}).range(from,from+pageSize-1);
  if(!isAdmin){if(!userTeamIds.length)return [];q=q.in('ekipa_id',userTeamIds);}
  const {data,error}=await q;if(error)throw error;
  all.push(...(data||[]));if(!data||data.length<pageSize)return all;from+=pageSize;
 }
 throw Error('Preveč zapisov za pregled. Potrebna je dodatna paginacija.');
}

async function siteUploadPhotos(id,input){
 if(!isAdmin)return;
 const status=document.getElementById('sitePhotoStatus'),files=[...(input.files||[])];
 for(const file of files){
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){alert('Dovoljene so JPG, PNG ali WebP fotografije do 8 MB.');continue;}
  const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
  const path=`${id}/${crypto.randomUUID()}.${ext}`;
  try{
   status.textContent='Nalaganje '+file.name+'...';
   const {error:uploadError}=await supabaseClient.storage.from(SITE_PHOTO_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
   if(uploadError)throw uploadError;
   const {error:saveError}=await supabaseClient.from('sylaj_site_photos').insert({site_id:String(id),storage_path:path,created_by:currentUser.id});

  }catch(e){status.textContent='Napaka pri nalaganju: '+e.message;input.value='';return;}
 }
 input.value='';await siteLoadPhotos(id);
}
async function siteDeletePhoto(siteId,photoId,path){
 if(!isAdmin||!confirm('Izbrišem fotografijo gradbišča?'))return;
 const {error}=await supabaseClient.from('sylaj_site_photos').delete().eq('id',photoId);
 if(error)return alert(error.message);

 if(storageError)alert('Zapis izbrisan, datoteka pa ni bila odstranjena: '+storageError.message);

}

// GPS is a rough field estimate, not a surveyed measurement. Capture requires HTTPS and location permission.
let siteGpsWatch=null,siteGpsPoints=[],siteGpsActiveSite=null,siteGpsMode='distance';
function siteMeasureDistance(a,b){const R=6371000,rad=Math.PI/180;const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}
function siteGpsResult(){
 const p=siteGpsPoints;if(p.length<2)return 0;
 if(siteGpsMode==='area'){
  if(p.length<3)return 0;
  const lat0=p.reduce((v,x)=>v+x.lat,0)/p.length*Math.PI/180;
  const xy=p.map(x=>({x:x.lon*Math.PI/180*6371000*Math.cos(lat0),y:x.lat*Math.PI/180*6371000}));
  return Math.abs(xy.reduce((a,x,i)=>a+x.x*xy[(i+1)%xy.length].y-xy[(i+1)%xy.length].x*x.y,0))/2;
 }
 return p.slice(1).reduce((a,x,i)=>a+siteMeasureDistance(p[i],x),0);
}
function siteRenderMeasure(id){
 const el=document.getElementById('siteMeasurePanel');if(!el)return;
 el.innerHTML=`<div class="site-measure-box"><b>📐 Izmeri z GPS ali kamero</b><p style="font-size:12px">GPS: približna razdalja / površina. Kamera: fotografija kot dokaz, ne samodejna meritev.</p><div class="action-bar"><button class="action-btn" onclick="siteGpsStart('${siteSafe(id)}','distance')">📍 GPS – metri</button><button class="action-btn" onclick="siteGpsStart('${siteSafe(id)}','area')">📍 GPS – m²</button><button class="action-btn" onclick="siteGpsStop()">⏹ Ustavi</button></div><div id="siteGpsStatus" aria-live="polite">GPS še ni zagnan.</div><div class="action-bar"><button class="action-btn" onclick="siteGpsSave('${siteSafe(id)}')">💾 Shrani izmero</button><label class="action-btn" style="cursor:pointer">📷 Kamera<input type="file" accept="image/*" capture="environment" style="display:none" onchange="siteUploadPhotos('${siteSafe(id)}',this)"></label><label class="action-btn" style="cursor:pointer">🖼️ Galerija<input type="file" accept="image/*" multiple style="display:none" onchange="siteUploadPhotos('${siteSafe(id)}',this)"></label></div></div>`;
 siteGpsUpdate();
}
function siteGpsUpdate(message){
 const el=document.getElementById('siteGpsStatus');if(!el)return;
 const n=siteGpsPoints.length,v=siteGpsResult(),unit=siteGpsMode==='area'?'m²':'m';
 el.textContent=(message?message+' · ':'')+`${n} GPS točk · približno ${v.toFixed(2)} ${unit}`;
}
function siteGpsStart(id,mode){
 if(!navigator.geolocation){siteGpsUpdate('GPS ni podprt v tem brskalniku');return;}
 if(siteGpsWatch!==null)navigator.geolocation.clearWatch(siteGpsWatch);
 siteGpsPoints=[];siteGpsActiveSite=id;siteGpsMode=mode;siteGpsWatch=null;
 siteGpsUpdate('Čakam na GPS dovoljenje');
 siteGpsWatch=navigator.geolocation.watchPosition(pos=>{
  if(String(siteGpsActiveSite)!==String(id))return;
  const accuracy=pos.coords.accuracy;
  if(!Number.isFinite(accuracy)||accuracy>25){siteGpsUpdate(`Preskočena netočna točka (±${Math.round(accuracy)} m)`);return;}
  const point={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy};
  const last=siteGpsPoints.at(-1);
  if(!last||siteMeasureDistance(last,point)>2)siteGpsPoints.push(point);
  siteGpsUpdate(`GPS ±${Math.round(accuracy)} m`);
 },err=>{siteGpsUpdate('GPS napaka: '+err.message);siteGpsStop(false);},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function siteGpsStop(update=true){if(siteGpsWatch!==null){navigator.geolocation.clearWatch(siteGpsWatch);siteGpsWatch=null;}if(update)siteGpsUpdate('Merjenje ustavljeno');}
async function siteGpsSave(id){
 if(!isAdmin)return alert('Shranjevanje je dovoljeno samo administratorju.');
 if(String(id)!==String(siteGpsActiveSite))return alert('Najprej izmerite ta objekt.');
 siteGpsStop();const value=siteGpsResult();
 if(!Number.isFinite(value)||value<=0)return alert('Premalo veljavnih GPS točk za izmero.');
 const kind=prompt('Vrsta dela (kanaleta, asfalt, tlakovci, tampon):',siteGpsMode==='area'?'asfalt':'kanaleta');if(!kind?.trim())return;
 const date=new Date().toLocaleDateString('sv-SE');
 const note=`${kind.trim()} – GPS približna izmera (${siteGpsPoints.length} točk, brez geodetske natančnosti)`;
 const {error}=await supabaseClient.from('sylaj_site_work').insert({site_id:String(id),work_date:date,description:note,quantity:Number(value.toFixed(2)),unit:siteGpsMode==='area'?'m²':'m',created_by:currentUser.id});
 if(error)return alert('Shranjevanje ni uspelo: '+error.message);
 siteGpsUpdate('Izmera shranjena');await siteLoadWork(id);
}

  for(let offset=0;offset<10000;offset+=page){
   let q=supabaseClient.from(spec.table).select(spec.cols).gte(spec.date,from).lt(spec.date,to).is(spec.deleted,null).order(spec.date,{ascending:true}).range(offset,offset+page-1);
   const {data,error}=await q;if(error)throw error;all.push(...(data||[]));if((data||[]).length<page)break;
  }
  if(key==='hours'&&!isAdmin){
   // Supabase RLS remains the primary permission boundary. This is an additional UI filter.
   all=all.filter(r=>userTeamIds.some(id=>String(id)===String(r.ekipa_id)));
  }
  const name=(arr,id,field)=>arr?.find(x=>String(x.id)===String(id))?.[field]||String(id??'');
  reportRows=all.map(r=>{
   if(key==='hours')return {Datum:r.datum,Delavec:name(state.cache.workers,r.delavec_id,'ime_priimek'),Ekipa:name(state.cache.teams,r.ekipa_id,'naziv'),Gradbišče:name(state.cache.sites,r.gradbisce_id,'naziv'),Začetek:r.zacetek,Konec:r.konec,Ure:calcHours(r.zacetek,r.konec),Opomba:r.opomba||''};
   return Object.fromEntries(Object.entries(r).filter(([k])=>k!=='id'));
  });
  const sum=key==='hours'?reportRows.reduce((n,r)=>n+(Number(r.Ure)||0),0):key==='invoices'?reportRows.reduce((n,r)=>n+(Number(r.skupaj)||0),0):null;
  status.textContent=`${reportRows.length} zapisov`+(sum===null?'':` · Skupaj: ${sum.toLocaleString('sl-SI',{maximumFractionDigits:2})}${key==='hours'?' ur':' €'}`)+(all.length>=10000?' · Prikazanih največ 10.000 zapisov':'');
  if(!reportRows.length){out.textContent='Ni zapisov za izbrano obdobje.';return;}
  const cols=Object.keys(reportRows[0]);
  out.innerHTML=`<table style="width:100%;border-collapse:collapse"><thead><tr>${cols.map(c=>`<th style="padding:7px;border-bottom:1px solid #ccc">${reportEscape(c)}</th>`).join('')}</tr></thead><tbody>${reportRows.slice(0,250).map(r=>`<tr>${cols.map(c=>`<td style="padding:7px;border-bottom:1px solid #ddd">${reportEscape(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>${reportRows.length>250?'<p>Na zaslonu je prvih 250 vrstic. Excel vsebuje vse naložene vrstice.</p>':''}`;
 }catch(e){status.textContent='Napaka pri branju: '+e.message;out.textContent='Preverite tabelo in dovoljenja Supabase (RLS).';}

const sylajOriginalText = new WeakMap();
const sylajOriginalPlaceholders = new WeakMap();
let sylajTranslationBusy = false;
function sylajTranslateDynamic(root=document.body) {
  if (!root || sylajTranslationBusy) return;
  sylajTranslationBusy = true;
  try {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let node;
    while ((node=walker.nextNode())) {
      const parent=node.parentElement;
      if (!parent || parent.closest('script,style,textarea,[contenteditable="true"]')) continue;
      if (parent.closest('[data-i18n]')) continue;
      const original=sylajOriginalText.get(node) ?? node.nodeValue;
      if (!sylajOriginalText.has(node)) sylajOriginalText.set(node,original);
      const match=original.match(/^(\s*)(.*?)(\s*)$/s);
      const word=match?.[2];
      const translated=sylajUiTerms[word]?.[currentLang];
      const next=translated ? match[1]+translated+match[3] : original;
      if (node.nodeValue!==next) node.nodeValue=next;
    }
    root.querySelectorAll?.('input[placeholder],textarea[placeholder]').forEach(el=>{
      const original=sylajOriginalPlaceholders.get(el) ?? el.placeholder;
      if (!sylajOriginalPlaceholders.has(el)) sylajOriginalPlaceholders.set(el,original);
      const translated=sylajUiTerms[original]?.[currentLang];
      if (el.placeholder!==(translated||original)) el.placeholder=translated||original;
    });
    document.documentElement.lang=currentLang;
  } finally { sylajTranslationBusy=false; }
}
const sylajBaseApplyTranslations=applyTranslations;
applyTranslations=function(){
  sylajBaseApplyTranslations();
  document.querySelectorAll('#lang-select,#login-lang').forEach(el=>{if([...el.options].some(o=>o.value===currentLang))el.value=currentLang;});
  sylajTranslateDynamic();
};
let sylajTranslationQueued=false;
const sylajTranslationObserver=new MutationObserver(()=>{
  if (sylajTranslationBusy || sylajTranslationQueued) return;
  sylajTranslationQueued=true;
  queueMicrotask(()=>{sylajTranslationQueued=false;sylajTranslateDynamic();});
});
sylajTranslationObserver.observe(document.body,{childList:true,subtree:true});
