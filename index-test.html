<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYLAJ-Evidenca TEST</title>
</head>
<body>
<p id="loading">Nalaganje aplikacije ...</p>
<script>
(async function(){
try {
 const response=await fetch('./index.html?test='+Date.now());
 if(!response.ok)throw Error('index.html ni dosegljiv');
 let html=await response.text();

 const extra=`
<style>
#workersView input,#workersView select{min-width:160px}
#workersView .worker-actions{display:flex;gap:6px;flex-wrap:wrap}
#teamSummary table{width:100%}
</style>
<script>
(function(){
'use strict';
let managementWorkers=[];
let managementTeams=[];
const oldShowTab=showTab;

showTab=function(which){
 oldShowTab(which);
 $('workersView').classList.toggle('hidden',which!=='workers');
 $('workersTab').classList.toggle('active',which==='workers');
 if(which==='workers')loadManagement();
};

const tab=document.createElement('button');
tab.id='workersTab';
tab.textContent='Upravljanje delavcev';
$('toolsTab').after(tab);
tab.onclick=()=>showTab('workers');

const view=document.createElement('div');
view.id='workersView';
view.className='hidden';
view.innerHTML=\`
<section class="card">
<h2>Upravljanje delavcev</h2>
<div class="row">
<label><span>Ime in priimek</span>
<input id="newWorkerName" placeholder="Ime in priimek"></label>
<label><span>Ekipa</span>
<select id="newWorkerTeam"></select></label>
<button id="addWorker">Dodaj delavca</button>
<button id="reloadWorkers" class="alt">Osveži</button>
</div>
<p id="workerMessage" class="msg"></p>
<div class="scroll">
<table>
<thead><tr>
<th>Delavec</th><th>Ekipa</th><th>Status</th><th>Dejanja</th>
</tr></thead>
<tbody id="managementRows"></tbody>
</table>
</div>
</section>
<section class="card">
<h2>Ure po ekipah</h2>
<p>Pregled po izbranem letu in mesecu.</p>
<div id="teamSummary"></div>
</section>\`;
$('toolsView').after(view);

const say=s=>msg(s,'workerMessage');

async function loadManagement(){
 if(!user)return;
 try{
  const tq=admin()
   ?db.from('ekipe').select('id,naziv,vodja_id').order('naziv')
   :db.from('ekipe').select('id,naziv,vodja_id')
     .eq('vodja_id',user.id).order('naziv');
  const [tr,wr]=await Promise.all([
   tq,
   db.from('delavci')
     .select('id,ime_priimek,ekipa_id,aktiven')
     .order('ime_priimek')
  ]);
  if(tr.error)throw tr.error;
  if(wr.error)throw wr.error;
  managementTeams=tr.data||[];
  managementWorkers=wr.data||[];

  $('newWorkerTeam').replaceChildren();
  managementTeams.forEach(t=>
   addOption('newWorkerTeam',t.id,t.naziv)
  );
  renderManagement();
  await renderTeamSummary();
  say('');
 }catch(e){say('Napaka: '+e.message)}
}

function renderManagement(){
 const body=$('managementRows');
 body.replaceChildren();
 const names=new Map(
  managementTeams.map(t=>[String(t.id),t.naziv])
 );
 managementWorkers.forEach(w=>{
  const tr=document.createElement('tr');
  const cell=value=>{
   const td=document.createElement('td');
   td.textContent=String(value);
   tr.append(td);
   return td;
  };
  cell(w.ime_priimek);
  cell(names.get(String(w.ekipa_id))||w.ekipa_id);
  cell(w.aktiven?'Aktiven':'Neaktiven');
  const td=cell('');
  const buttons=document.createElement('div');
  buttons.className='worker-actions';

  const toggle=document.createElement('button');
  toggle.textContent=w.aktiven?'Deaktiviraj':'Aktiviraj';
  toggle.className=w.aktiven?'alt':'';
  toggle.onclick=()=>toggleWorker(w);
  buttons.append(toggle);

  if(admin()){
   const transfer=document.createElement('button');
   transfer.textContent='Premesti';
   transfer.onclick=()=>transferWorker(w);
   buttons.append(transfer);
  }
  td.append(buttons);
  body.append(tr);
 });
}

async function addWorker(){
 const name=$('newWorkerName').value.trim();
 const teamId=Number($('newWorkerTeam').value);
 if(!name||!teamId)return say('Vnesite ime in ekipo.');
 if(!managementTeams.some(t=>Number(t.id)===teamId))
  return say('Nedovoljena ekipa.');
 if(!confirm('Dodati delavca '+name+'?'))return;
 try{
  const {data,error}=await db.from('delavci')
   .insert({ime_priimek:name,ekipa_id:teamId,aktiven:true})
   .select('id');
  if(error)throw error;
  if(!data?.length)throw Error('Vnos ni potrjen.');
  $('newWorkerName').value='';
  await loadWorkers();
  await loadManagement();
  await loadToolWorkers();
  say('Delavec je dodan.');
 }catch(e){say('Napaka: '+e.message)}
}

async function toggleWorker(w){
 const active=!w.aktiven;
 if(!confirm(
  (active?'Aktivirati ':'Deaktivirati ')+w.ime_priimek+'?'
 ))return;
 try{
  const {data,error}=await db.from('delavci')
   .update({aktiven:active}).eq('id',w.id)
   .select('id');
  if(error)throw error;
  if(!data?.length)throw Error('Sprememba ni potrjena.');
  await loadWorkers();
  await loadManagement();
  say('Status je posodobljen.');
 }catch(e){say('Napaka: '+e.message)}
}

async function transferWorker(w){
 if(!admin())return;
 const options=managementTeams
  .map(t=>t.id+' = '+t.naziv).join('\\n');
 const answer=prompt(
  'Izberite ID nove ekipe:\\n'+options,
  String(w.ekipa_id)
 );
 if(answer===null)return;
 const id=Number(answer);
 if(!managementTeams.some(t=>Number(t.id)===id))
  return say('Neveljavna ekipa.');
 if(id===Number(w.ekipa_id))return;
 if(!confirm('Premestiti '+w.ime_priimek+
  '? Prejšnje ure morajo ostati v stari ekipi.'))return;
 try{
  const {data,error}=await db.from('delavci')
   .update({ekipa_id:id}).eq('id',w.id)
   .select('id');
  if(error)throw error;
  if(!data?.length)throw Error('Premestitev ni potrjena.');
  await loadWorkers();
  await loadTeams();
  await loadManagement();
  await refresh();
  say('Delavec je premeščen.');
 }catch(e){say('Napaka: '+e.message)}
}

async function renderTeamSummary(){
 const y=Number($('year').value);
 if(!Number.isInteger(y)||y<2020||y>2100)return;
 const from=y+'-01-01',to=(y+1)+'-01-01';
 let entries=[],offset=0;
 while(true){
  const {data,error}=await db.from('delovne_ure')
   .select('delavec_id,ekipa_id,datum,zacetek,konec')
   .gte('datum',from).lt('datum',to)
   .order('datum',{ascending:true})
   .range(offset,offset+999);
  if(error)throw error;
  entries.push(...(data||[]));
  if(!data||data.length<1000)break;
  offset+=1000;
 }
 const wrap=$('teamSummary');
 wrap.replaceChildren();
 const table=document.createElement('table');
 const head=document.createElement('tr');
 ['Ekipa','Mesec','Leto'].forEach(v=>{
  const th=document.createElement('th');
  th.textContent=v;head.append(th);
 });
 table.append(head);
 managementTeams.forEach(t=>{
  const mine=entries.filter(e=>
   String(e.ekipa_id)===String(t.id)
  );
  const monthly=mine.filter(e=>
   Number(e.datum.slice(5,7))===selectedMonth
  );
  const tr=document.createElement('tr');
  [t.naziv,fmt(total(monthly)),fmt(total(mine))]
   .forEach(v=>{
    const td=document.createElement('td');
    td.textContent=v;tr.append(td);
   });
  table.append(tr);
 });
 wrap.append(table);
}

$('addWorker').onclick=addWorker;
$('reloadWorkers').onclick=loadManagement;

const originalRefresh=refresh;
refresh=async function(){
 await originalRefresh();
 if(!$('workersView').classList.contains('hidden')){
  try{await renderTeamSummary()}
  catch(e){say('Napaka pri urah: '+e.message)}
 }
};

const originalLogin=$('loginBtn').onclick;
$('loginBtn').onclick=async function(){
 await originalLogin();
 if(user&&!$('app').classList.contains('hidden')){
  await loadManagement();
 }
};

const originalLogout=$('logout').onclick;
$('logout').onclick=async function(){
 await originalLogout();
 managementWorkers=[];
 managementTeams=[];
 $('workersView').classList.add('hidden');
};

})();
<\/script>`;

 html=html.replace(
  '</body></html>',
  extra+'</body></html>'
 );
 if(!html.includes('id="workersTab"'))
  throw Error('Dodatek ni bil vstavljen.');
 document.open();
 document.write(html);
 document.close();
}catch(e){
 document.body.textContent='Napaka: '+e.message;
}
})();
</script>
</body>
</html>
