
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>SYLAJ-Evidenca</title>
      </head>
      <body>
        <h1>SYLAJ-Evidenca</h1>
          <p>
            Mirë se vini në aplikacionin SYLAJ!</p>

            <div>
              <h2>Prijava – SYLAJ</h2>
                <input type="email" id="email" placeholder="E-pošta">
                  <input type="password" id="password" placeholder="Geslo">
                    <button onclick="prijava()">Prijava</button>
                      <p id="sporocilo"></p>
                      </div>

         <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

         <script>
           const SUPABASE_URL = "https://zofclcgkgwfsjrcewfml.supabase.co";
             const SUPABASE_KEY = "sb_publishable_s_F7X1QzEaBUhbQ4WL4QTQ_HEkhEFEQ";

               const db = window.supabase.createClient(
                   SUPABASE_URL,
                       SUPABASE_KEY
                         );

                         async function prijava() {
                           const email = document.getElementById("email").value.trim();
                             const password = document.getElementById("password").value;
                               const porocilo = document.getElementById("sporocilo");

                                 const { error } = await db.auth.signInWithPassword({
                                     email: email,
                                         password: password
                                           });

                                             porocilo.textContent = error
                                                 ? "Prijava ni uspela: " + error.message
                                                     : "Prijava uspešna!";
                                                     }
                                                     
                         </script>

  <div id="orari" style="display:none">
  <h2>Evidenca delovnih ur</h2>
  <p>Dobrodošli v SYLAJ-Evidenca!</p>
  <button onclick="odjava()">Odjava</button>
  </div>
      </body>
          </html>
