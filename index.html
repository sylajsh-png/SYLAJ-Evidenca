
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>SYLAJ-Evidenca</title>
      </head>
      <body>
        <h1>SYLAJ-Evidenca</h1>
          <p>
            Mirë se vini në aplikacionin SYLAJ!</p>

            <div>
              <h2>Prijava – SYLAJ</h2>
                <input type="email" id="email" placeholder="E-pošta">
                  <input type="password" id="password" placeholder="Geslo">
                    <button onclick="prijava()">Prijava</button>
                      <p id="sporocilo"></p>
                      </div>

         <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

         <script>
           const SUPABASE_URL = "https://zofclcgkgwfsjrcewfml.supabase.co";
             const SUPABASE_KEY = "sb_publishable_s_F7X1QzEaBUhbQ4WL4QTQ_HEkhEFEQ";

               const db = window.supabase.createClient(
                   SUPABASE_URL,
                       SUPABASE_KEY
                         );

                         async function prijava() {
                           const email = document.getElementById("email").value.trim();
                             const password = document.getElementById("password").value;
                               const porocilo = document.getElementById("sporocilo");

                                 const { error } = await db.auth.signInWithPassword({
                                     email: email,
                                         password: password
                                           });

                                             porocilo.textContent = error
                                                 ? "Prijava ni uspela: " + error.message
                                                     : "Prijava uspešna!";
    
                         if (!error) {
  document.getElementById("orari").style.display = "block";
const { data: profili } = await db
  .from("profili")
  .select("vloga")
  .eq("id", (await db.auth.getUser()).data.user.id)
  .single();

if (profili?.vloga === "admin") {
  document.getElementById("admin-panel").style.display = "block";
  await ngarkoPunetoret();
}
                         }
                         }
   async function ngarkoPunetoret() {
  const { data, error } = await db
    .from("delavci")
    .select("ime_priimek, ekipe(naziv)")
    .order("ime_priimek");

  const lista = document.getElementById("seznam-delavcev");

  if (error) {
    lista.textContent = "Napaka: " + error.message;
    return;
  }

  lista.innerHTML = "";

  data.forEach(d => {
    const p = document.createElement("p");
    p.textContent =
      d.ime_priimek + " – " + (d.ekipe?.naziv || "Brez ekipe");
    lista.appendChild(p);
  });
   }                                                  
                       async function odjava() {
  const { error } = await db.auth.signOut();

  if (error) {
    alert("Odjava ni uspela: " + error.message);
    return;
  }

  document.getElementById("orari").style.display = "none";
  document.getElementById("sporocilo").textContent = "";
                       }  </script>

  <div id="orari" style="display:none">
  <h2>Evidenca delovnih ur</h2>
  <p>Dobrodošli v SYLAJ-Evidenca!</p>
  <button onclick="odjava()">Odjava</button>
  </div>
        
<div id="admin-panel" style="display:none">
  <h2>Administracija SYLAJ</h2>
  <h3>Ekipe in delavci</h3>
  <div id="seznam-delavcev"></div>
</div>

      </body>
          </html>
